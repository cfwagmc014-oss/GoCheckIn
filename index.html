<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C0272D">
<title>ST14 - Customer Checklist</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C0272D;--blue:#0168B5;--bg:#f3f4f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e3e6ee;--ok:#1e8e4e;--warn:#d98200;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:16px;line-height:1.15;margin:0;flex:1}
header.top .chip{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px;font-size:13px;border:0;color:#fff}
.badge-sync{background:#ffd34d;color:#4a3500;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 90px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filters .full{grid-column:1/-1}
.filters #fSf.hide+#fGrp{grid-column:1/-1}
.filters #fSf:not(.hide){display:block}
input[type=search],input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(1,104,181,.15)}
textarea{min-height:70px;resize:vertical}
.count{font-size:13px;color:var(--mut);margin:2px 2px 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,30,60,.07);cursor:pointer;display:flex;gap:10px}
.card:active{background:#f8f9fc}
.card.closed{position:relative;overflow:hidden;background:#fff5f5;box-shadow:0 0 0 1px #f0b4b4}
.card.closed .main{opacity:.72}
.stampc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg);pointer-events:none;z-index:2;padding:2px 14px;border:3px double #C0272D;border-radius:6px;color:#C0272D;font-weight:900;font-size:26px;letter-spacing:2px;line-height:1.25;text-align:center;opacity:.78;white-space:nowrap;background:rgba(255,255,255,.28);text-shadow:0 0 1px rgba(192,39,45,.4)}
.stampc small{display:block;font-size:11px;letter-spacing:4px;font-weight:800}
.card .main{flex:1;min-width:0}
.card .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .side{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.card .side b{display:block;font-size:15px;color:var(--ink)}
.card.out{border:2px solid var(--red);background:#fff1f1}
.pnum{background:var(--red);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.card.done{opacity:.55}.card.done .pnum{background:var(--ok)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts .btn{padding:7px 10px;font-size:13.5px;width:auto;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
#printView{display:none}
@media print{body>*:not(#printView){display:none!important}#printView{display:block!important;padding:14px;color:#000;background:#fff;font-family:'Sarabun',sans-serif}#printView table{width:100%;border-collapse:collapse;font-size:12px}#printView th,#printView td{border:1px solid #999;padding:4px 6px;text-align:left}#printView th{background:#eee}#printView h1{font-size:20px;margin:0 0 4px;color:#C0272D}#printView .k{display:flex;gap:18px;margin:10px 0;font-size:14px}#printView .k b{display:block;font-size:20px}}
.card.vac{border:2px solid #e0a800;background:#fff9db}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef0f6;color:#46506a}
.tag.ok{background:#e1f4e9;color:var(--ok)}.tag.warn{background:#fff1d6;color:#8a5600}.tag.bad{background:#fde3e4;color:var(--red)}.tag.blue{background:#e1effa;color:var(--blue)}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;width:100%}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.grey{background:#e9ebf2;color:var(--ink)}
.btn.sm{padding:8px 12px;width:auto;font-size:14px}
.btn:disabled{opacity:.5}
.more{margin:10px 0}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12.5px;color:var(--mut)}
nav.bottom button b{display:block;font-size:20px}
nav.bottom button.on{color:var(--red);font-weight:700}
.login{max-width:380px;margin:8vh auto;padding:0 18px}
.login .logo{background:var(--red);color:#fff;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}
.login h1{margin:0;font-size:22px}.login p{margin:4px 0 0;opacity:.9;font-size:14px}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,35,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .hd{background:#fff;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.sheet .hd .tt{flex:1;min-width:0}.sheet .hd .tt b{font-size:17px}.sheet .hd .tt div{font-size:13px;color:var(--mut)}
.sheet .x{border:0;background:#eef0f6;border-radius:50%;width:34px;height:34px;font-size:18px}
.sheet .bd{overflow:auto;padding:12px;flex:1}
.sheet .ft{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}
.box{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px}
.box h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.bars div{flex:1;text-align:center;font-size:10.5px;color:var(--mut)}
.bars i{display:block;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:2px}
.gps{padding:10px;border-radius:10px;background:#eef6fd;font-size:14px;margin-bottom:10px}
.gps.ok{background:#e1f4e9}.gps.bad{background:#fde3e4}
details{background:#fff;border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}

/* ===== Dashboard (การ์ดสไตล์ใหม่) ===== */
.dsg{display:grid;grid-template-columns:1fr;gap:12px}.dsg .wide{grid-column:1/-1}
@media(min-width:900px){.dsg{grid-template-columns:1fr 1fr}#pDash{max-width:1100px}}
.dc{background:#fff;border-radius:18px;padding:14px 14px 12px;box-shadow:0 2px 10px rgba(20,30,60,.06);margin:0}
.dc h3{margin:0 0 10px;font-size:14.5px;color:var(--ink);font-weight:700}
.dsgh{font-weight:700;font-size:12.5px;padding:10px 0 2px;letter-spacing:.2px}
.dshero{background:linear-gradient(135deg,#0168B5 0%,#014a82 60%,#0a2f57 100%);color:#fff}
.dshd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}.dshd small{font-size:16px;font-weight:700;display:block}
.dsref{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.dsh3{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}.dsh3 div{text-align:center;min-width:84px}.dsh3 b{display:block;font-size:26px}.dsh3 span{font-size:12px;opacity:.85}
.dstiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:900px){.dstiles{grid-template-columns:repeat(4,1fr)}}
.dstile{border-radius:18px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(20,30,60,.12)}
.dstile .ic{position:absolute;right:10px;top:8px;font-size:22px;opacity:.9}.dstile b{display:block;font-size:28px;margin-top:6px}.dstile span{font-size:12.5px;opacity:.95}
.dstile.g{background:linear-gradient(135deg,#27b567,#1e8e4e)}.dstile.a{background:linear-gradient(135deg,#f6b21a,#e08a00)}.dstile.b{background:linear-gradient(135deg,#3b9be0,#0168B5)}.dstile.p{background:linear-gradient(135deg,#8a6cf0,#5a3fc4)}
.dstile.a.hot{background:linear-gradient(135deg,#e5484d,#C0272D)}
.dsbar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:8px;overflow:hidden}.dsbar i{display:block;height:100%;background:#fff;border-radius:9px}
.dsbp{background:linear-gradient(135deg,#0168B5,#0a3f8f);color:#fff}
.dsbpg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.dsbpg{grid-template-columns:repeat(4,1fr)}}
.dsbpg span{display:block;font-size:12px;opacity:.85}.dsbpg b{font-size:22px}
.dsrk{width:20px;height:20px;border-radius:50%;background:#eef2fa;color:var(--blue);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.dspill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}.dspill.g{background:#dff3e8;color:#1e8e4e}.dspill.a{background:#fff0cf;color:#a86400}.dspill.r{background:#fde3e4;color:#C0272D}
table.dst th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}table.dst td{white-space:nowrap}
.dc .hbar .p{height:9px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:var(--r);padding:12px}.kpi b{font-size:26px;display:block}.kpi span{font-size:12.5px;color:var(--mut)}
.prog{height:9px;background:#e6e9f1;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}.hbar .l{width:46%}.hbar .p{flex:1;height:10px;background:#e6e9f1;border-radius:9px;overflow:hidden}.hbar .p i{display:block;height:100%;background:var(--blue)}.hbar .n{width:38px;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}table.t th:first-child,table.t td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%}
.hist{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;font-size:13.5px}
.mut{color:var(--mut);font-size:13px}
.demo{background:#fff1d6;color:#8a5600;font-size:12.5px;text-align:center;padding:4px}
.chk{display:flex;gap:14px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;font-size:14px}
</style>
</head>
<body>
<div id="demoBar" class="demo hide">โหมดทดลอง — ข้อมูลเก็บในเครื่องนี้เท่านั้น (ตั้งค่า API_URL เพื่อเชื่อม Google Sheets)</div>

<!-- LOGIN -->
<div id="vLogin" class="login hide">
  <div class="logo"><img src="logo.png" alt="" onerror="this.remove()" style="height:84px;width:84px;border-radius:18px;margin-bottom:10px;box-shadow:0 0 0 3px rgba(255,255,255,.6)"><h1>ST14 - Customer Checklist</h1><p>Go Wholesale Rayong ST.14 · ติดตามลูกค้า B2B</p></div>
  <div class="box">
    <div class="field"><label>ผู้ใช้งาน</label><select id="lgSf"></select></div>
    <div class="field"><label>รหัสผ่าน</label><input id="lgPin" type="password" inputmode="text" autocomplete="off"></div>
    <button class="btn red" id="lgGo">เข้าสู่ระบบ</button>
    <div class="mut" id="lgMsg" style="margin-top:8px"></div>
  </div>
</div>

<!-- MAIN -->
<div id="vMain" class="hide">
  <header class="top"><img src="logo.png" alt="" onerror="this.remove()" style="height:34px;width:34px;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.7)"><h1 id="hdTitle">ST14 - Customer Checklist</h1><button class="chip badge-sync hide" id="syncBadge"></button><button class="chip" id="hdRefresh">⟳</button><button class="chip" id="hdUser"></button></header>

  <div id="pList" class="wrap">
    <div class="filters">
      <input class="full" id="fQ" type="search" placeholder="ค้นหา ชื่อ / ร้าน / รหัสสมาชิก / เบอร์ / ที่อยู่">
      <select id="fSf" class="hide"></select>
      <select id="fGrp"></select>
      <select id="fDist"></select>
      <div id="fcsBox"><button type="button" class="btn ghost" id="fcsBtn" style="width:100%;text-align:left;display:flex;justify-content:space-between"><span id="fcsTxt">🏷️ สถานะ: ทั้งหมด</span><span>▾</span></button></div>
      <div id="fcsPanel" class="box hide full" style="margin:0;padding:8px 10px"></div>
      <select id="fStatus" class="full"></select>
      <select id="fSort" class="hide"></select>
      <div class="full" id="fsrBox"><button type="button" class="btn ghost" id="fsrBtn" style="width:100%;text-align:left;display:flex;justify-content:space-between;border-color:#0168B5;color:#0168B5"><span id="fsrTxt">↕️ เรียง</span><span>▾</span></button><div id="fsrPanel" class="box hide" style="margin:6px 0 0;padding:8px 10px"></div></div>
    </div>
    <div class="count"><span id="cntTxt"></span><span id="cntSub"></span></div>
    <div id="list"></div>
    <button class="btn grey more hide" id="moreBtn">แสดงเพิ่ม</button>
  </div>

  <div id="pDash" class="wrap hide"></div>
  <div id="pExport" class="wrap hide"></div>
  <div id="pManage" class="wrap hide"></div>
  <div id="pPlan" class="wrap hide"></div>
  <div id="pFind" class="wrap hide">
    <div class="box"><h3>ตรวจสอบว่าลูกค้าอยู่ในพอร์ตของใคร</h3>
      <input id="findQ" type="search" placeholder="ชื่อ / ชื่อร้าน / เลขสมาชิก / เบอร์โทร (อย่างน้อย 3 ตัว)">
      <p class="mut" style="margin:6px 0 0">ค้นได้ทั้งสาขา ทุกพอร์ต · แสดงเฉพาะผู้ดูแลและข้อมูลทั่วไป</p></div>
    <div id="findRes"></div>
  </div>

  <nav class="bottom">
    <button data-tab="Find"><b>🔎</b>ค้นหาพอร์ต</button>
    <button data-tab="List" class="on"><b>📋</b>รายชื่อ</button>
    <button data-tab="Plan"><b>🗓️</b>แผนวันนี้</button>
    <button data-tab="Dash"><b>📊</b>สรุปผล</button>
    <button data-tab="Export"><b>⬇️</b>Export</button>
    <button data-tab="Manage" class="hide" id="navMg"><b>🛠️</b>จัดการข้อมูล</button>
  </nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  PLAN_APPROVAL: true,                // ต้องส่งแผนเยี่ยมให้ผู้จัดการอนุมัติ (ไม่บล็อกการ Check-in) — ตั้ง false เพื่อปิด
  GOTASK_URL: 'https://cfwagmc014-oss.github.io/go-task/',
  BRANCH: { lat: 12.683028307521779, lng: 101.24121614233023 },   // Go Wholesale ระยอง
  BRANCH_RADIUS_M: 100,               // ปิดงานที่สาขา: ต้องอยู่ห่างจากสาขาไม่เกิน (ม.)
  SHOP_RADIUS_M: 150,                 // ปิดงานที่ร้านสุดท้าย: ต้องอยู่ใกล้จุด Check-in ร้านสุดท้ายไม่เกิน (ม.) + ต้องถ่ายรูป
  CLOSE_MAX_ACC_M: 50,                // GPS ตอนปิดงานต้องแม่นกว่า (ม.)   // พิกัด Go Wholesale ระยอง (จุดตั้งต้น/จุดกลับ) — ใส่ที่นี่เพื่อใช้ร่วมกันทุกเครื่อง หรือให้เซลส์ตั้งเองในหน้าแผนวันนี้
  API_URL: 'https://script.google.com/macros/s/AKfycbxyOxVY6jxbDx-JUwhLIyZgBikOlgPlY0eAiY6NYh30p0APXHS77fg3HbDjkWKiy-rNvg/exec',                 // ← วาง Web App URL ของ Apps Script ที่นี่ (เว้นว่าง = โหมดทดลอง)
  DEMO_DATA: 'demo-data.json',
  SF_LIST: ['1401','1402','1403','1404','1405','1406','1407','1408','1409','1410','1411','1412','1413'],
  SHOP_RADIUS_WARN_M: 300,
  PIN_TARGET_M: 10,            // ความแม่นยำ GPS ที่ต้องการ (เมตร)
  GPS_MAX_MS: 30000,           // เวลาสูงสุดที่รอให้ GPS แม่นขึ้น
  MAP_DEFAULT: [12.6814,101.2816],
  BP_SALES_KEYS: ['s4','s5','s6'],   // เดือนที่ใช้เฉลี่ยยอดซื้อ GW เทียบกับ Potential (ตอนนี้ = ส.ค.-ต.ค. 2026) — เปลี่ยนเมื่ออัปเดตข้อมูลรอบใหม่
  BP_SALES_LABEL: 'ส.ค.–ต.ค.',
  BP_CATS: ['เนื้อสัตว์/อาหารสด','ผักผลไม้','ของแห้ง','เครื่องดื่ม','ของใช้/บรรจุภัณฑ์']
};
const DEMO = !CONFIG.API_URL;
const VISIT_RESULTS = ['พบเจ้าของ/ผู้ตัดสินใจ','พบพนักงาน/ผู้ช่วย','ร้านปิด (ไม่พบคน)','ไม่พบร้านตามที่อยู่','โทร/LINE ไม่ติด'];
const ST_TEMP='ปิดชั่วคราว (กำหนดเปิด ภายใน 1-3 เดือน)';
const CUST_STATUS = ['เปิดกิจการ - ซื้อประจำ','เปิดกิจการ - ซื้อบ้างครั้งคราว','เปิดกิจการ - ยังไม่ซื้อ/หยุดซื้อ','เป็นผู้ประกอบการ - ซื้อกินซื้อใช้','เป็นบุคคลทั่วไป',ST_TEMP,'ย้ายที่ตั้ง','ติดต่อไม่ได้','เลิกกิจการ'];
const ST_GROUPS=[['🟢 กลุ่มลูกค้าที่เปิดกิจการ',CUST_STATUS.slice(0,3)],['🏷️ กลุ่มประเภทผู้ซื้อ',CUST_STATUS.slice(3,5)],['⚠️ กลุ่มที่ไม่ได้ดำเนินการตามปกติ',CUST_STATUS.slice(5)]];
// ชื่อสถานะเดิมที่เคยบันทึกไว้ → แปลงเป็นชื่อใหม่ตอนอ่านข้อมูล (ข้อมูลเก่าใน Sheet ไม่ต้องแก้)

// อ่าน GPS ต่อเนื่อง เก็บค่าที่แม่นที่สุด หยุดเมื่อ ≤ target หรือหมดเวลา
function watchBest(onUpd,onDone,onErr,o={}){
  const target=o.target||CONFIG.PIN_TARGET_M,max=o.max||CONFIG.GPS_MAX_MS;let best=null,stopped=false,id=null,tm=null;
  const stop=()=>{stopped=true;if(id!=null)navigator.geolocation.clearWatch(id);clearTimeout(tm)};
  if(!navigator.geolocation){onErr(new Error('อุปกรณ์ไม่รองรับ GPS'));return stop}
  id=navigator.geolocation.watchPosition(p=>{if(stopped)return;const c={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      if(!best||c.acc<best.acc){best=c;onUpd(best)} if(best.acc<=target){stop();onDone(best,true)}},
    e=>{if(stopped)return;if(!best){stop();onErr(new Error(e.code==1?'ไม่ได้อนุญาตใช้ตำแหน่ง (เปิด Location ในเบราว์เซอร์)':'หาตำแหน่งไม่ได้'))}},
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  tm=setTimeout(()=>{if(stopped)return;stop();best?onDone(best,false):onErr(new Error('หาตำแหน่งไม่ได้'))},max);
  return stop;
}

  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Esri'});
  let isSat=false;$$('#pkSat').onclick=()=>{isSat=!isSat;if(isSat){map.removeLayer(osm);sat.addTo(map)}else{map.removeLayer(sat);osm.addTo(map)}$$('#pkSat').textContent=isSat?'🗺️ แผนที่':'🛰️ ดาวเทียม'};

  if(cur)put(cur);info();
  map.on('click',e=>put(e.latlng));
  $$('#pkGps').onclick=()=>{stopW&&stopW();const b=$$('#pkGps');b.disabled=true;
    stopW=watchBest(p=>{$$('#pkInfo').textContent=`⏳ GPS ±${Math.round(p.acc)} ม. กำลังปรับให้แม่นขึ้น…`;put({lat:p.lat,lng:p.lng},true);if(circle)map.removeLayer(circle);circle=L.circle([p.lat,p.lng],{radius:p.acc,weight:1}).addTo(map)},

const fixPhone=v=>{v=String(v||'').trim();if(!v)return '';const d=v.replace(/[\s\-]/g,'');return /^[1-9]\d{8}$/.test(d)?'0'+d:v};
const V=(c,k)=>{const u=c.u;const v=(u&&u[k]!==undefined&&u[k]!=='')?u[k]:(c[k]??'');return k==='phone'?fixPhone(v):v};
const numC=x=>{const n=parseFloat(String(x??'').replace(/,/g,''));return isNaN(n)?null:n};
const gwAvg=c=>Math.round(CONFIG.BP_SALES_KEYS.reduce((a,k)=>a+(c[k]||0),0)/CONFIG.BP_SALES_KEYS.length);
const bpOf=c=>{const u=c.u;if(!u)return null;let t=numC(u.bp_total);if(!t){t=[1,2,3,4,5].reduce((a,i)=>a+(numC(u['bp_c'+i])||0),0)||null}
  if(!t)return null;const gw=gwAvg(c);return{total:t,gw,gap:Math.max(0,t-gw),share:gw/t*100}};
const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n};
const shopPin=c=>{const a=num(c.u?.shop_lat),b=num(c.u?.shop_lng);return(a&&b)?{lat:a,lng:b}:null};
const addrLine=c=>[V(c,'house'),V(c,'bldg'),V(c,'alley'),V(c,'road')&&('ถ.'+V(c,'road')),V(c,'subd'),V(c,'dist'),V(c,'prov'),V(c,'post')].filter(Boolean).join(' ');
const mapUrl=c=>{const p=shopPin(c);return p?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((V(c,'biz')||c.name)+' '+addrLine(c))}`};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const lastLabel=c=>{const l=c.last;if(!l)return 'ไม่เคยซื้อ';const m=/^(\d{4})-(\d\d)$/.exec(l);return m?`${TH_M[+m[2]-1]} ${m[1]}`:`ปี ${l}`};
const title=c=>V(c,'biz')||c.name||c.id;
const checked=c=>!!(c.u&&c.u.visits>0);
const due=c=>{const n=c.u?.next_follow;return !!n&&n<=todayStr()};
const incomplete=c=>!V(c,'phone')||!shopPin(c);

async function loadData(force){
  const key='gw_cache_'+(S.role==='admin'?'ALL':S.user.sf);
  showLoading('กำลังโหลดรายชื่อลูกค้า…');
  let cols,rows=[],upd={};
  try{
    const sf=S.role==='admin'?'ALL':S.user.sf; let off=0,total=1;
    while(off<total){const j=await api('list',{sf,offset:off,limit:4000});cols=j.cols;total=j.total;rows=rows.concat(j.rows);Object.assign(upd,j.upd);off+=4000;showLoading(`กำลังโหลด ${rows.length}/${total}`)}
    if(S.role!=='admin')lsSet(key,{cols,rows,upd});
  }catch(e){
    const c=lsGet(key,null); if(!c){hideLoading();toast('โหลดไม่สำเร็จ: '+e.message,5000);throw e}
    ({cols,rows,upd}=c); toast('ออฟไลน์ — ใช้ข้อมูลที่เก็บไว้ล่าสุด',4000);
  }
  S.all=rows.map(r=>mk(cols,r,upd[r[cols.indexOf('id')]]));
  S.byId={};S.all.forEach(c=>S.byId[c.id]=c);
  // เอา queue ที่ยังไม่ส่งมาแปะทับ (optimistic)
  S.queue.forEach(q=>applyLocal(q.rec));
  hideLoading(); buildFilters(); applyFilters(); renderDash(); renderExport();
}
function applyLocal(rec){const c=S.byId[rec.id];if(!c)return;const u=c.u||{visits:0,lastVisit:'',lastRes:''};const n={...u,...rec};if(n.cust_status)n.cust_status=normSt(n.cust_status);
  n.visits=(u.visits||0)+(rec.type!=='EDIT'?1:0);n.lastVisit=rec.type!=='EDIT'?rec.ts:u.lastVisit;n.lastRes=rec.type!=='EDIT'?rec.visit_result:u.lastRes;c.u=n}

  }catch(e){

const STATUS_OPTS=[['all','ทั้งหมด'],['notyet','ยังไม่เคย Check-in'],['done','Check-in แล้ว'],['due','ถึงกำหนดติดตาม'],['incomplete','ข้อมูลไม่ครบ (ไม่มีเบอร์/พิกัด)'],['nophone','ยังไม่มีเบอร์โทร'],['nopin','ยังไม่ปักพิกัด'],['buy3','ซื้อใน 3 เดือนล่าสุด'],['nobuy3','ไม่ซื้อ 3 เดือนล่าสุด'],['pdel','รอ Delete / Inactive'],['out','🔴 ไม่อยู่ในพอร์ตใหม่ (กล่องแดง)'],['newp','เติมใหม่ / ย้ายเข้าพอร์ต'],['vac','🟡 ยังไม่มี SF ดูแล (กล่องเหลือง)'],['nobp','💰 ยังไม่มีข้อมูล Potential'],['hasbp','💰 มีข้อมูล Potential แล้ว']];
const SORT_OPTS=[['sales','เรียง: ยอดซื้อ 3 เดือน สูง→ต่ำ'],['gap','เรียง: ช่องว่างโอกาส (Potential) สูง→ต่ำ'],['sow','เรียง: Share of Wallet ต่ำ→สูง'],['cur','เรียง: ยอดเดือนนี้ สูง→ต่ำ'],['ytd','เรียง: ยอดรวมปี 2026 สูง→ต่ำ'],['name','เรียง: ชื่อ ก-ฮ'],['near','เรียง: ใกล้ฉันที่สุด'],['due','เรียง: นัดติดตามใกล้สุด'],['last','เรียง: Check-in ล่าสุด']];
function buildFilters(){
  const opts=(arr,all)=>`<option value="">${all}</option>`+[...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th')).map(x=>`<option>${esc(x)}</option>`).join('');
  $('#fStatus').innerHTML=STATUS_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  $('#fSort').innerHTML=SORT_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('#fSort').value=S.filt.sort;
  const keepG=$('#fGrp').value,keepD=$('#fDist').value,keepS=$('#fSf').value;
  $('#fGrp').innerHTML=opts(S.all.map(c=>c.grp),'ทุกกลุ่มลูกค้า');$('#fDist').innerHTML=opts(S.all.map(c=>V(c,'dist')),'ทุกอำเภอ');
  $('#fGrp').value=keepG;$('#fDist').value=keepD;
  const isAdmin=S.user.sf==='ALL';$('#fSf').classList.toggle('hide',!isAdmin);
  if(isAdmin){$('#fSf').innerHTML='<option value="">ทุกพอร์ต (SF)</option><option value="__none">ยังไม่มี SF ดูแล</option>'+[...new Set(S.all.map(c=>c.sf).filter(Boolean))].sort().map(x=>`<option value="${x}">${sfShort(x)}</option>`).join('');$('#fSf').value=keepS}
}
function applyFilters(){
  const f=S.filt; const q=f.q.trim().toLowerCase();
  let v=S.all.filter(c=>{
    if(f.cs&&f.cs.size&&!f.cs.has((c.u&&c.u.cust_status)||'__none'))return false;
    if(f.grp&&c.grp!==f.grp)return false; if(f.dist&&V(c,'dist')!==f.dist)return false;
    if(f.sf){if(f.sf==='__none'){if(c.sf)return false}else if(c.sf!==f.sf)return false}
    switch(f.status){case'notyet':if(checked(c))return false;break;case'done':if(!checked(c))return false;break;case'due':if(!due(c))return false;break;
      case'incomplete':if(!incomplete(c))return false;break;case'nophone':if(V(c,'phone'))return false;break;case'nopin':if(shopPin(c))return false;break;
      case'buy3':if(!(c.s3m>0))return false;break;case'nobuy3':if(c.s3m>0)return false;break;case'pdel':if(!(c.pdel||c.inact))return false;break;case'out':if(c.port!=='OUT')return false;break;case'vac':if(c.port!=='VACANT')return false;break;case'nobp':if(bpOf(c))return false;break;case'hasbp':if(!bpOf(c))return false;break;case'newp':if(c.port!=='NEW'&&c.port!=='MOVED')return false;break}
    if(q){const hay=(c.id+' '+c.name+' '+V(c,'biz')+' '+V(c,'phone')+' '+V(c,'contact')+' '+addrLine(c)).toLowerCase();if(!hay.includes(q))return false}
    return true});
  const cmp={name:(a,b)=>title(a).localeCompare(title(b),'th'),sales:(a,b)=>b.s3m-a.s3m||b.ytd-a.ytd,gap:(a,b)=>((bpOf(b)?.gap)??-1)-((bpOf(a)?.gap)??-1),sow:(a,b)=>((bpOf(a)?.share)??1e9)-((bpOf(b)?.share)??1e9),cur:(a,b)=>b.s7-a.s7||b.s3m-a.s3m,ytd:(a,b)=>b.ytd-a.ytd,
    due:(a,b)=>(a.u?.next_follow||'9')>(b.u?.next_follow||'9')?1:-1,last:(a,b)=>(b.u?.lastVisit||'').localeCompare(a.u?.lastVisit||'')};
  if(f.sort==='near'&&S.pos){v.forEach(c=>{const p=shopPin(c);c._d=p?hav(S.pos.lat,S.pos.lng,p.lat,p.lng):1e12});v.sort((a,b)=>a._d-b._d)}
  else v.sort(cmp[f.sort==='near'?'name':f.sort]);
  S.view=v;S.page=1;if(typeof srLabel==='function')srLabel();renderList();
}

/* ============ QUEUE / SYNC ============ */
let flushing=false;
function syncBadge(){const b=$('#syncBadge');b.classList.toggle('hide',!S.queue.length);b.textContent=`⏳ รอส่ง ${S.queue.length}`}
$('#syncBadge').onclick=()=>flushQueue(true);
async function flushQueue(manual){
  if(flushing||!S.queue.length){syncBadge();return}
  flushing=true;
  try{
    while(S.queue.length){const q=S.queue[0];
      const j=await api('save',{rec:q.rec,photoData:q.photoData||undefined});
      if(j.photo&&S.byId[q.rec.id]?.u)S.byId[q.rec.id].u.photo=j.photo;
      S.queue.shift();lsSet('gw_queue',S.queue);syncBadge()}
    if(manual)toast('ส่งข้อมูลครบแล้ว ✓');
  }catch(e){ if(manual)toast('ส่งไม่สำเร็จ: '+e.message,4000) }
  flushing=false;syncBadge();
}
window.addEventListener('online',()=>flushQueue());

function dsDonut(parts,big,sub,size=132,track='#e6e9f1',ink='var(--ink)'){const T=parts.reduce((x,p)=>x+p.v,0);let off=25,seg='';
  if(T>0)parts.forEach(p=>{const l=p.v*100/T;if(l>0){seg+=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${p.c}" stroke-width="5.2" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${off}"/>`;off-=l}});
  return `<svg viewBox="0 0 42 42" width="${size}" height="${size}" style="flex:none"><circle cx="21" cy="21" r="15.915" fill="none" stroke="${track}" stroke-width="5.2"/>${seg}<text x="21" y="21.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="${ink}">${big}</text><text x="21" y="27" text-anchor="middle" font-size="2.9" fill="${ink}" opacity=".7">${sub||''}</text></svg>`}

}

/* ============ แผนเยี่ยมรายวัน (สร้างอัตโนมัติ) ============ */
const PLAN_N=[8,10,12,15,20,25];
const isToday=c=>(c.u?.lastVisit||'').startsWith(todayStr());
// วันที่ของแผน: วันนี้ / พรุ่งนี้ / มะรืนนี้ (สร้างล่วงหน้าได้ 2 วัน)
const PD=()=>{const t=todayStr();return S.planDate&&S.planDate>t&&S.planDate<=addDays(t,2)?S.planDate:t};
const isPD=c=>(c.u?.lastVisit||'').startsWith(PD());
const isFuture=()=>PD()>todayStr();
let planN=(v=>PLAN_N.includes(v)?v:12)(lsGet('gw_plan_n',12));
const PLAN_REST=[0,30,45,60,90];let planRest=lsGet('gw_plan_rest45',45);
// ร้านที่เพิ่งเยี่ยมภายใน planRest วัน (และไม่ถึงวันนัดติดตาม) จะไม่ถูกจัดเข้าแผน
const recentVisit=c=>{if(!planRest)return false;const u=c.u||{};if(!u.visits||!u.lastVisit)return false;if(u.next_follow&&u.next_follow<=PD())return false;return dayDiff(u.lastVisit.slice(0,10),PD())<planRest};
const planKey=sf=>'gw_plan_'+sf+'_'+PD();
const planScope=()=>S.user.sf==='ALL'?(S.planSf||''):S.user.sf;
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
// ให้คะแนนความสำคัญของร้าน — คะแนนสูง = ควรเยี่ยมก่อน
function planScore(c,maxS){
  const u=c.u||{},t=PD(),R=[];let sc=0;const st=u.cust_status||'';
  if(/เลิกกิจการ|ย้ายที่ตั้ง/.test(st))return null;
  const due=u.next_follow&&u.next_follow<=t;
  if(due){const d=dayDiff(u.next_follow,t);sc+=100+Math.min(20,d);R.push(['bad','นัดติดตาม'+(d>0?` เกิน ${d} วัน`:' วันนี้')])}
  if(!u.visits){sc+=35;R.push(['blue','ยังไม่เคยเยี่ยม'])}
  else{const d=dayDiff((u.lastVisit||'').slice(0,10),t);sc+=Math.min(25,d*0.8);if(d<=7&&!due)sc-=50;if(d>=14)R.push(['',`เยี่ยมล่าสุด ${d} วันก่อน`]);
    if(/ร้านปิด|ไม่พบร้าน|ไม่ติด/.test(u.lastRes||'')&&d>=2){sc+=15;R.push(['warn','ครั้งก่อนไม่พบ'])}}
  if(c.ytd>0&&c.s6+c.s7===0){sc+=45;R.push(['warn',`หยุดซื้อ ${MONTHS[5]}–${MONTHS[6].replace('*','')}`])}
  else if(c.ytd===0){sc+=25;R.push(['','ยังไม่เคยซื้อปีนี้'])}
  const b=bpOf(c);if(b&&b.gap>0){sc+=Math.min(30,b.gap/3000);if(b.gap>=20000)R.push(['ok','ช่องว่าง '+fmt(b.gap)])}
  sc+=20*Math.sqrt(Math.max(0,c.s3m)/maxS);if(c.s3m>0&&c.s3m>=maxS*0.5)R.push(['ok','ลูกค้ามูลค่าสูง'])
  if(c.pdel||c.inact){sc-=60;R.push(['warn','รอ Delete/Inactive'])}
  if(/ปิดชั่วคราว/.test(st))sc-=30;
  return{sc,R};
}
const areaKey=c=>(V(c,'dist')||'')+'|'+(V(c,'subd')||'');
// แผนล่วงหน้า: ไม่ซ้ำกับร้านที่อยู่ในแผนของวันก่อนหน้า (ในเครื่องนี้)
function priorPlanned(sf){const S2=new Set();for(let d=todayStr();d<PD();d=addDays(d,1)){((lsGet('gw_plan_'+sf+'_'+d,null)||{}).ids||[]).forEach(i=>S2.add(i))}return S2}
function planPool(sf,exclude,area){
  const pr=isFuture()?priorPlanned(sf):new Set();
  const pool=S.all.filter(c=>c.sf===sf&&!isToday(c)&&!recentVisit(c)&&!pr.has(c.id)&&!exclude.has(c.id)&&(!area||areaKey(c)===area));
  const maxS=Math.max(1,...pool.map(c=>c.s3m));
  return pool.map(c=>({c,...(planScore(c,maxS)||{sc:null})})).filter(x=>x.sc!==null).sort((a,b)=>b.sc-a.sc);
}
// เรียงเส้นทาง: จัดกลุ่มตามตำบล/อำเภอ → ในกลุ่มใช้ร้านที่มีหมุดวิ่งจากใกล้ไปไกล (ถ้ามีตำแหน่งปัจจุบัน/หมุดร้าน)
function orderPlan(items,pos){
  const G={};items.forEach(x=>{const k=(V(x.c,'dist')||'')+'|'+(V(x.c,'subd')||'-');(G[k]=G[k]||[]).push(x)});
  const gs=Object.values(G);gs.forEach(g=>g.sort((a,b)=>b.sc-a.sc));
  const dOf=g=>{let m=1e12;g.forEach(x=>{const q=shopPin(x.c);if(q&&pos)m=Math.min(m,hav(pos.lat,pos.lng,q.lat,q.lng))});return m};
  gs.sort((a,b)=>{const da=dOf(a),db=dOf(b);return da!==db?da-db:Math.max(...b.map(x=>x.sc))-Math.max(...a.map(x=>x.sc))});
  const out=[];let last=pos||null;
  gs.forEach(g=>{const pool=g.filter(x=>shopPin(x.c)),rest=g.filter(x=>!shopPin(x.c));let cur=last;
    while(pool.length){let bi=0;if(cur){let bd=1e12;pool.forEach((x,i)=>{const q=shopPin(x.c),d=hav(cur.lat,cur.lng,q.lat,q.lng);if(d<bd){bd=d;bi=i}})}const x=pool.splice(bi,1)[0];out.push(x);cur=shopPin(x.c)}
    if(cur)last=cur;rest.forEach(x=>out.push(x))});
  return out;
}
// เลือกร้านเข้าแผนแบบกระจุก: เอาร้านคะแนนสูงสุดเป็นศูนย์กลาง แล้วเติมร้านที่อยู่ใกล้ (รัศมี 3→5→8→15 กม.) เรียงตามคะแนน
const PLAN_TIERS=[3000,5000,8000,15000,1e12];
function clusterPick(cands,need,keep){
  if(need<=0||!cands.length)return[];
  const kp=keep.map(id=>S.byId[id]).filter(Boolean).map(shopPin).filter(Boolean);
  const seed=cands[0],ap=kp[0]||shopPin(seed.c),ak=areaKey(seed.c);
  const dist=x=>{const q=shopPin(x.c);if(ap&&q)return hav(ap.lat,ap.lng,q.lat,q.lng);return areaKey(x.c)===ak?1500:1e11};
  const out=[],used=new Set(),take=(f)=>{for(const x of cands){if(out.length>=need)return;if(used.has(x.c.id)||!f(x))continue;used.add(x.c.id);out.push(x)}};
  const pos=x=>x.sc>0;
  PLAN_TIERS.forEach(r=>take(x=>pos(x)&&dist(x)<=r));   // ร้านที่มีคะแนน เรียงจากใกล้ศูนย์กลางเป็นวงๆ
  take(()=>true);                                       // เติมให้ครบด้วยร้านที่เหลือ
  return out;
}
function buildPlan(sf,n,keep,skipped,area){
  const keepSet=new Set(keep),ex=new Set([...keep,...skipped]);
  const need=Math.max(0,n-keep.length);
  let picks=clusterPick(planPool(sf,ex,area),need,keep);
  // พอร์ตครบรอบแล้ว (ร้านที่เหลือหมดแล้วแต่ยังไม่ครบจำนวน) → เริ่มรอบใหม่ด้วยร้านที่ไม่ได้เยี่ยมนานที่สุด
  if(picks.length<need&&planRest){const have=new Set([...ex,...picks.map(x=>x.c.id)]);
    const old=S.all.filter(c=>c.sf===sf&&!have.has(c.id)&&!isToday(c)&&(!area||areaKey(c)===area)&&recentVisit(c)&&planScore(c,1)!==null)
      .sort((a,b)=>(a.u.lastVisit||'').localeCompare(b.u.lastVisit||'')).map(c=>({c,sc:0}));
    picks=picks.concat(clusterPick(old,need-picks.length,[...keep,...picks.map(x=>x.c.id)]).map(x=>({...x,round2:true})))}
  const ordered=orderPlan(picks,S.planPos);
  return{date:PD(),sf,n,rest:planRest,area:area||'',manual:keep.filter(id=>!isPD(S.byId[id])),ids:[...keep,...ordered.map(x=>x.c.id)],skipped};
}

  return `${fmt(v)}/${fmt(all.length)} ร้าน (${all.length?Math.round(v*100/all.length):0}%) ใน ${planRest} วัน · เหลือ ${fmt(all.length-v)} ร้าน`}

    <p class="mut" style="margin:6px 0 0">กม. = ระยะทางจริงจากพิกัด Check-in ของวันนั้น (${branchPt()?routeTxt():'ระหว่างร้านเท่านั้น — ยังไม่ได้ตั้งพิกัดสาขา'}) · รวมวันนี้ ${km1(sfs.reduce((a,x)=>a+(trvOf(T,x,d)?trvOf(T,x,d).m:0),0))} กม.</p>
    <div class="acts"><button class="btn ghost" id="apX">📗 Excel ติดตามแผน 30 วัน</button></div></div>${det}`;
  $('#apRef').onclick=e=>{e.preventDefault();S.travel=null;fillAdminAppr(true)};
  const goDay=nd=>{S.apprDate=nd;const di=$('#apD');if(di)di.value=nd;const tb=box.querySelector('table');if(tb)tb.style.opacity='.45';
    if(S.apWait)S.apWait();S.apWait=waitToast(`⏳ กำลังเลื่อนไป ${ddmm(nd)} รอสักครู่…`);fillAdminAppr(true,true)};
  $('#apPrev').onclick=()=>goDay(addDays(S.apprDate||d,-1));
  $('#apNext').onclick=()=>goDay(addDays(S.apprDate||d,1));
  $('#apD').onchange=e=>goDay(e.target.value||todayStr());
  $('#apX').onclick=async()=>{try{await loadXlsx();showLoading('กำลังรวบรวม…');const t=todayStr(),k=await api('planList',{sf:'ALL',from:addDays(t,-30),to:t});hideLoading();
    let T2=[];try{T2=await getTravel()}catch(e){}
    const A=[['วันที่','SF','สถานะ','จำนวนแผน','เยี่ยมตามแผน','% ตามแผน','นอกแผน','Check-in แรก','ระยะทาง (กม.)','ปิดงาน','รูปยืนยัน','ส่งเมื่อ','ตัดสินเมื่อ','หมายเหตุ']],M=[['วันที่','SF','รหัสสมาชิก','ชื่อร้าน','ตำบล/อำเภอ','ละติจูด','ลองจิจูด']],L=[['วันที่','SF','ลำดับในแผน','รหัสสมาชิก','ชื่อร้าน','ตำบล/อำเภอ','ละติจูด','ลองจิจูด','เยี่ยมแล้ว','เวลา Check-in','ระยะจากจุดก่อนหน้า (กม.)']];
    const ll=c=>{const q=c&&shopPin(c);return [q?q.lat:'',q?q.lng:'']};
    k.plans.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.sf<b.sf?-1:1).forEach(p=>{A.push([p.date,sfShort(p.sf),({SUBMITTED:'รออนุมัติ',APPROVED:'อนุมัติแล้ว',REJECTED:'ส่งกลับ',DRAFT:'ร่าง'})[p.status]||p.status,p.ids.length,p.done.length,p.ids.length?Math.round(p.done.length*100/p.ids.length):0,p.extra,(trvOf(T2,p.sf,p.date)&&trvOf(T2,p.sf,p.date).stops.length?hhmm(trvOf(T2,p.sf,p.date).stops[0].ts):''),(trvOf(T2,p.sf,p.date)?+km1(trvOf(T2,p.sf,p.date).m):''),...(()=>{const c=(S.closes||{})[p.sf+'|'+p.date];return [c?(c.mode==='BRANCH'?'จบที่สาขา':'จบที่ร้านสุดท้าย')+(c.status==='APPROVED'?' (อนุมัติแล้ว)':' (รออนุมัติ)'):(trvOf(T2,p.sf,p.date)?'ยังไม่ปิดงาน':''),c&&c.photo||'']})(),p.submitted_ts,p.decided_ts,p.note]);
      if(p.status==='APPROVED'&&p.date<t)p.ids.filter(i=>!p.done.includes(i)).forEach(id=>{const c=S.byId[id];M.push([p.date,sfShort(p.sf),id,c?title(c):'',c?[V(c,'subd'),V(c,'dist')].filter(Boolean).join(' / '):'',...ll(c)])});
      p.ids.forEach((id,i)=>{const c=S.byId[id];L.push([p.date,sfShort(p.sf),i+1,id,c?title(c):'',c?[V(c,'subd'),V(c,'dist')].filter(Boolean).join(' / '):'',...ll(c),p.done.includes(id)?'Y':'',(()=>{const g=trvOf(T2,p.sf,p.date),st=g&&g.stops.find(x=>x.id===id);return st?hhmm(st.ts):''})(),(()=>{const g=trvOf(T2,p.sf,p.date),st=g&&g.stops.find(x=>x.id===id);return st?+km1(st.leg):''})()])})});
    const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(A),w2=XLSX.utils.aoa_to_sheet(M),w3=XLSX.utils.aoa_to_sheet(L);w1['!cols']=[{wch:12},{wch:9},{wch:13},{wch:10},{wch:12},{wch:10},{wch:9},{wch:14},{wch:16},{wch:30},{wch:19},{wch:19},{wch:30}];w2['!cols']=[{wch:12},{wch:9},{wch:14},{wch:36},{wch:26},{wch:12},{wch:12}];w3['!cols']=[{wch:12},{wch:9},{wch:10},{wch:14},{wch:36},{wch:26},{wch:12},{wch:12},{wch:9},{wch:12},{wch:18}];
    XLSX.utils.book_append_sheet(wb,w1,'ติดตามแผน');XLSX.utils.book_append_sheet(wb,w3,'รายร้านตามแผน');XLSX.utils.book_append_sheet(wb,w2,'ร้านที่ไม่ได้เยี่ยมตามแผน');XLSX.writeFile(wb,`GW_PlanTracking_${stamp()}.xlsx`)}catch(e){hideLoading();toast(e.message,4000)}};
  box.onclick=async e=>{const ca=e.target.closest('[data-ca]');if(ca){try{showLoading('กำลังบันทึก…');await api('closeDecide',{close_id:ca.dataset.ca,by:S.user.name});hideLoading();S.travel=null;toast('อนุมัติปิดงานแล้ว');fillAdminAppr()}catch(err){hideLoading();toast(err.message,4000)}return}
    const ro=e.target.closest('[data-ro]');if(ro){const note=prompt('ส่งกลับให้แก้/เปิดงานใหม่ — ระบุเหตุผล (เซลส์จะเห็น)');if(note===null)return;try{showLoading('กำลังบันทึก…');await api('closeReopen',{close_id:ro.dataset.ro,note,by:S.user.name});hideLoading();S.travel=null;toast('ส่งกลับแล้ว');fillAdminAppr()}catch(err){hideLoading();toast(err.message,4000)}return}
    const b=e.target.closest('[data-ad]');if(!b)return;const id=b.dataset.id,a=b.dataset.ad,p=j.plans.find(x=>x.plan_id===id);
    try{if(a==='gt'){const g=goTaskText(p);try{await navigator.clipboard.writeText(g.title+'\n\n'+g.desc);toast('คัดลอกรายละเอียดงานแล้ว — วางในหน้าสร้างงานของ GO TASK',4500)}catch(_){prompt('คัดลอกข้อความนี้ไปวางใน GO TASK',g.title+'\n\n'+g.desc)}window.open(CONFIG.GOTASK_URL+'#/new','_blank','noopener');return}
      if(a==='clr'){if(!confirm('ล้างแผนนี้ให้เป็น 0? ลบถาวร เซลส์ต้องสร้างและส่งแผนใหม่'))return;showLoading('กำลังล้าง…');await api('planClear',{plan_id:id});hideLoading();toast('ล้างแผนแล้ว');return fillAdminAppr()}
      let note='';if(a==='no'){note=prompt('เหตุผลที่ส่งกลับ (เซลส์จะเห็น)')||'';if(!note)return}
      showLoading('กำลังบันทึก…');await api('planDecide',{plan_id:id,decision:a==='ok'?'APPROVED':'REJECTED',note,by:S.user.name});hideLoading();toast(a==='ok'?'อนุมัติแล้ว':'ส่งกลับแล้ว');fillAdminAppr()
    }catch(err){hideLoading();toast(err.message,4000)}};
}



/* ============ จัดการข้อมูล (เฉพาะ Admin) ============ */
function renderManage(){
  const el=$('#pManage');if(S.user.sf!=='ALL'){el.innerHTML='<div class="box mut">เฉพาะผู้จัดการ</div>';return}
  const sfs=[...new Set(S.all.map(c=>c.sf).filter(Boolean))].sort();
  el.innerHTML=`<div class="box" style="border:1px solid #C0272D"><h3>🛠️ จัดการข้อมูล <span class="tag warn">เฉพาะ Admin</span></h3>
    <p class="mut" style="margin:0 0 10px">การลบทั้งหมดในหน้านี้ถาวร กู้คืนไม่ได้ (ยกเว้นข้อ 2 ที่สำรองชีตให้ก่อน)</p>
    <div style="border-top:1px solid #eee;padding-top:10px"><b>1) 🧹 ล้างข้อมูลของวัน → ให้เป็น 0</b>
      <div class="mut" style="margin:2px 0 6px">ลบ แผน + Check-in + ปิดงาน ของวัน/SF ที่เลือก</div>
      <div class="field"><input type="date" id="mgD" value="${S.mgDate||todayStr()}"></div>
      <div class="field"><select id="mgSf"><option value="">ทุก SF</option>${sfs.map(x=>`<option>${x}</option>`).join('')}</select></div>
      <button class="btn red" id="mgWipe">🧹 ล้างข้อมูลของวัน</button></div>
    <div style="border-top:1px solid #eee;margin-top:12px;padding-top:10px"><b>2) 🧼 ทำความสะอาด Records</b>
      <div class="mut" style="margin:2px 0 6px">ลบ Check-in ที่ซ้ำ และที่ไม่มีพิกัด Check-in จริง ออกจากชีต Records (สำรองชีตให้ก่อนอัตโนมัติ)</div>
      <button class="btn ghost" id="mgClean">🔍 ตรวจและล้างข้อมูลซ้ำ/ไม่มีพิกัด</button></div></div>`;
  $('#mgD').onchange=e=>{S.mgDate=e.target.value};
  const d0=()=>$('#mgD').value||todayStr();
  $('#mgClean').onclick=async()=>{try{showLoading('กำลังตรวจ Records…');const r=await api('recCleanup',{dry:true});hideLoading();
      if(!r.dup&&!r.noloc){toast(`Records ${r.total} แถว — ไม่พบรายการซ้ำหรือไม่มีพิกัด ✅`,4500);return}
      if(!confirm(`พบใน Records ${r.total} แถว:\n• ซ้ำ ${r.dup} แถว\n• Check-in ไม่มีพิกัด ${r.noloc} แถว\nเหลือ ${r.keep} แถว\n\nลบถาวร (ระบบสำรองชีตไว้ให้ก่อน) — ดำเนินการ?`))return;
      showLoading('กำลังล้าง…');const x=await api('recCleanup',{dry:false});S.travel=null;S.recVer=(S.recVer||0)+1;S.seen=new Set();await loadData();hideLoading();toast(`ล้างแล้ว: ซ้ำ ${x.dup} · ไม่มีพิกัด ${x.noloc}${x.backup?' · สำรอง: '+x.backup:''}`,6000);renderManage()}catch(err){hideLoading();toast(err.message,4000)}};
  $('#mgWipe').onclick=async()=>{const w=$('#mgSf').value;if(!confirm(`ล้างข้อมูลทั้งหมดของ ${w||'ทุก SF'} วันที่ ${ddmm(d0())} ให้เป็น 0?\n(แผน + Check-in + ปิดงาน) ลบถาวร กู้คืนไม่ได้`))return;
    try{showLoading('กำลังล้าง…');const r=await api('dayWipe',{date:d0(),sf:w});
      S.queue=S.queue.filter(q=>!(q.rec.type==='CHECKIN'&&String(q.rec.ts).slice(0,10)===d0()&&(!w||q.rec.user===w)));lsSet('gw_queue',S.queue);
      Object.keys(localStorage).filter(k=>k.startsWith('gw_plan_')&&k.endsWith('_'+d0())&&(!w||k.includes('_'+w+'_'))).forEach(k=>localStorage.removeItem(k));
      S.travel=null;S.recVer=(S.recVer||0)+1;S.seen=new Set();await loadData();hideLoading();toast(`ล้างแล้ว: แผน ${r.plans||0} · Check-in ${r.checkins||0} · ปิดงาน ${r.closes||0}`,4500);renderManage()}catch(err){hideLoading();toast(err.message,4000)}};
}

/* ============ เรียลไทม์: sync ข้อมูลใหม่ + รีเฟรชรายงานอัตโนมัติ ============ */
const tsMinus=(ts,ms)=>new Date(Date.parse(ts+'Z')-ms).toISOString().slice(0,19);
async function syncRecent(){
  if(S.syncBusy)return 0;S.syncBusy=true;
  try{
    if(!S.syncSince){const r=await api('recent',{sf:S.user.sf});S.syncSince=tsMinus(r.now,90000);return 0}
    const r=await api('recent',{sf:S.user.sf,since:S.syncSince});let n=0;S.seen=S.seen||new Set();
    r.rows.forEach(rec=>{const k=rec.device+'|'+rec.ts+'|'+rec.id;if(S.seen.has(k))return;S.seen.add(k);const c=S.byId[rec.id];if(!c)return;
      if(rec.type!=='EDIT'&&c.u&&c.u.lastVisit&&String(rec.ts)<=String(c.u.lastVisit))return;applyLocal(rec);n++});
    S.syncSince=tsMinus(r.now,90000);return n;
  }catch(e){return 0}finally{S.syncBusy=false}
}
let liveN=0;
async function liveTick(force){
  if(!S.user||(document.hidden&&!force))return;liveN++;
  try{
    if(S.tab==='Plan'){if(S.user.sf==='ALL')await fillAdminAppr(true);else await fillSalesAppr(planScope(),false)}
    else if(S.tab==='Dash'&&S.user.sf==='ALL'&&(force||liveN%2===0)){await syncRecent();S.travel=null;renderDash()}
  }catch(e){}
}
setInterval(()=>liveTick(),15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)liveTick(true)});

/* ============ BOOT ============ */
syncBadge();initLogin();
</script>
